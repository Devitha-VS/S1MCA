<!DOCTYPE html>
<html>
<head>
<title>Webpage with iframe</title>
</head>
<style>
body{
margin:0;
font-family:Arial;
}
h1{
text-align:center;
background-color:lightblue;
padding:20px;
margin:0;
}
.container{
display:flex;
height:500px;
}
.left{
width:50%;
border-right:2px solid black;
}
.right{
width:50%;
}
iframe{
width:100%;
height:100%;
border:none;
}
</style>
</head>
<body>
<h1>NATURE ITEMS</h1>
<div class="container">
<div class="left">
<iframe src="menu.html"></iframe>

</div>
<div class="right">
<iframe name="display"></iframe>
</div>
</div>
</body>
</html>
