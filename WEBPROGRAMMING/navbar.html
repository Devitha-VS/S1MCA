<!DOCTYPE html>
<html>
<head>
<title>Navbar using css</title>
<style>
.sidenav{
height:100%;
width:160px;
padding-top:20px;
background-color:green;
position:fixed;
top:0;
left:0;
}
.sidenav a{
display:block;
text-decoration:none;
padding-top:6px;
padding-right:8px;
padding-bottom:6px;
padding-left:16px;
color:white;
}
.sidenav a:hover{
color:red;
}
.main{
margin-left:160px;
padding:0px 10px;
height:2000px;
}
</style>
</head>
<body>
<div class="sidenav">
<a href="#">About Us</a>
<a href="#">Departments</a>
<a href="#">Vision and Mission</a>
<a href="#">Contact Us</a>
</div>
<div class="main">
<h1>side bar example</h1>
</div>
</body>
</html>
